services:
  rollers:
    build: .
    image: mewa/suivi-rollers:3.0.0
    container_name: mewa-rollers
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      # L'application est accessible sur http://<serveur>:8080
      - "8080:8080"
    volumes:
      - rollers-data:/data

volumes:
  rollers-data:
